[package]
name = "craft-local-ai"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Explicit, read-only document Q&A through a loopback model server"

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53", features = ["rt", "time"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
